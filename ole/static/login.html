<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lefse, your St. Olaf helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
:root { --sky: #e6eef6; --paper: #fff; --ink: #1d2b53; --ink-soft: #4f5b7a; --gold: #f2b632; --berry: #c8324a;
        --dough: #f6e3bc; --toast: #b3702f; --line: #c4d3e3; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --sky: #0f1a33; --paper: #1a2a4f; --ink: #eaf0fa; --ink-soft: #aab6cf; --berry: #ff7a8f; --line: #2b3d68;
          color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
       background: var(--sky); color: var(--ink); font: 17px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
main { width: min(380px, 100%); text-align: center; }
svg.big { width: 132px; height: 132px; display: block; margin: 0 auto 6px; }
h1 { font: 600 34px/1.1 Fredoka, sans-serif; margin: 0 0 6px; }
p { color: var(--ink-soft); margin: 0 0 20px; }
form { display: flex; gap: 8px; background: var(--paper); border: 2px solid var(--line); border-radius: 26px;
       padding: 6px 6px 6px 18px; }
form:focus-within { border-color: var(--gold); }
input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: inherit; outline: none; }
button { border: 0; border-radius: 999px; background: var(--gold); color: #1d2b53; font: 700 16px/1 inherit;
         padding: 12px 18px; cursor: pointer; font-family: inherit; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.error { color: var(--berry); font-weight: 700; margin: 14px 0 0; }
.blink .eye { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { .blink .eye { animation: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><!--LEFSE--></svg>
<main>
  <svg class="big blink" viewBox="0 0 120 120" role="img" aria-label="Lefse, a smiling round flatbread"><use href="#lefse"/></svg>
  <h1>Hei! I'm Lefse.</h1>
  <p>This is a test version, so it needs a password for now. Ask Hamzah if you don't have one.</p>
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required autofocus>
    <button>Come in</button>
  </form>
  <!--ERROR-->
</main>
</body>
</html>
