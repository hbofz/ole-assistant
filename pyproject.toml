[project]
name = "ole-assistant"
version = "0.1.0"
description = "St. Olaf Q&A chatbot demo (RAG over public St. Olaf websites)"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "beautifulsoup4",
    "fastapi",
    "fastembed",
    "httpx",
    "openai>=3.40.0",
    "protego",
    "pypdf",
    "python-dotenv",
    "qdrant-client",
    "trafilatura",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ole"]

[tool.pytest.ini_options]
addopts = "-m 'not live and not integration'"
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]
markers = [
    "live: calls the Claude API (costs money)",
    "integration: needs Qdrant running and the index built",
]
